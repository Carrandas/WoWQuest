<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WoWQuest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: a dark tooltip-style adventurer's sheet. Hero banner + live task, meters row, then character | chronicle | spellbook & bags. Single dark theme by choice. */
:root {
  --ink: #07090f;
  --panel: #0e1320;
  --panel-2: #141b2c;
  --rim: #283149;
  --text: #e9e4d6;
  --dim: #9097a8;
  --gold: #ffd100;
  --gold-dk: #9a7d14;
  --poor: #9d9d9d;
  --common: #f2f2f2;
  --uncommon: #1eff00;
  --rare: #4a9cf0;
  --epic: #b65cf5;
  --legend: #ff8000;
  --alli: #4a7bd8;
  --horde: #d43b30;
  --xp: #a64fd9;
  --rest: #3a78d4;
  --good: #63d64a;
  --hp-ok: #3fbf3f; --hp-mid: #e6d23a; --hp-low: #ef8a24; --hp-crit: #e0332e;
  --rage: #c8312b; --energy: #e8d44a;
  --display: "Cinzel", "Trajan Pro", Georgia, serif;
  --body: "Alegreya Sans", system-ui, sans-serif;
  --label: "Alegreya Sans SC", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: radial-gradient(ellipse at 50% -10%, #1a2340 0%, var(--ink) 62%) fixed, var(--ink);
  color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.42;
}
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 14px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button:disabled { cursor: not-allowed; }
.lbl { font-family: var(--label); font-weight: 700; letter-spacing: .08em; font-size: 12.5px; color: var(--dim); text-transform: lowercase; }
.num { font-variant-numeric: tabular-nums; }

/* top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 800; font-size: 24px; color: var(--gold); letter-spacing: .04em; line-height: 1; user-select: none; -webkit-user-select: none; cursor: default;
  text-shadow: 0 0 12px #ffd10033, 0 2px 0 #000; }
.controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--rim); border-radius: 999px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 4px 11px; font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--gold); color: var(--ink); font-weight: 700; }
.speedbox { display: inline-flex; gap: 8px; align-items: center; }
.speedbox[hidden] { display: none; }
.ghost { background: transparent; border: 1px solid var(--rim); border-radius: 999px; padding: 4px 12px; font-family: var(--label); font-weight: 700; font-size: 13px; letter-spacing: .05em; color: var(--dim); }
.ghost:hover { color: var(--text); border-color: var(--gold-dk); }
.saved { font-size: 12px; color: var(--dim); min-width: 48px; text-align: right; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--gold-dk); color: var(--gold);
  padding: 8px 16px; border-radius: 8px; font-family: var(--label); font-weight: 700; letter-spacing: .05em; z-index: 30; box-shadow: 0 6px 24px #000a; }

/* hero banner */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); gap: 20px; align-items: end; border-bottom: 1px solid var(--rim); padding-bottom: 18px; }
.who h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(32px, 5vw, 50px); line-height: 1; overflow-wrap: anywhere; }
.who .sub { margin-top: 6px; font-size: 18px; color: var(--dim); }
.who .sub b { color: var(--text); font-weight: 700; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.tag { display: inline-flex; gap: 6px; align-items: center; font-family: var(--label); font-weight: 700; font-size: 13px; letter-spacing: .06em; border: 1px solid var(--rim); border-radius: 999px; padding: 3px 12px 3px 9px; color: var(--dim); }
.tag.zone { color: var(--good); }
.tag.zone::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); }
.tag.Alliance { color: #8fb0f0; border-color: #2f4f8f; background: #4a7bd81a; }
.tag.Horde { color: #f08a80; border-color: #8f2f28; background: #d43b301a; }
.now { min-width: 0; }
.now .lbl { color: var(--gold); }
.now .desc { font-size: clamp(19px, 2.2vw, 24px); margin: 4px 0 10px; min-height: 1.42em; overflow-wrap: anywhere; }
.now .desc::after { content: "…"; color: var(--dim); }
.now .casts { min-height: 1.4em; margin: -6px 0 8px; color: var(--dim); font-size: 15px; overflow-wrap: anywhere; }
.now .casts .cur { color: var(--gold); }
.bigbar { position: relative; height: 22px; border-radius: 3px; background: #05070c; border: 1px solid #5a4a12; overflow: hidden; box-shadow: inset 0 2px 6px #000a; }
.bigbar .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(180deg, #ffe066, #e0b100 55%, #9a7a00); }
.bigbar .fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, #fff5 50%, transparent 70%); background-size: 200% 100%; animation: sheen 2.2s linear infinite; }
.bigbar .pct { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--text); text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
@keyframes sheen { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .bigbar .fill::after { animation: none; } }

/* meters */
.meters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.meter { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.meter .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.meter .val { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--dim); white-space: nowrap; }
.meter .name { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.4em; }
.bar { height: 9px; border-radius: 2px; background: #05070c; border: 1px solid var(--rim); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; transition: width .25s linear; }
.m-xp i { background: linear-gradient(90deg, #7a2fb0, var(--xp)); }
.m-bag i { background: #b07a43; }
.m-quest i { background: var(--gold); }
.m-zone i { background: var(--good); }

/* main grid */
.main { display: grid; grid-template-columns: 310px minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.sec h2 { margin: 0 0 8px; font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .03em; color: var(--gold); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sec h2 small { font-family: var(--body); font-weight: 400; font-size: 13px; color: var(--dim); letter-spacing: 0; }
.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.rows li { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 4px 0; border-bottom: 1px dashed #28314999; min-width: 0; }
.rows li:last-child { border-bottom: 0; }
.rows .k { color: var(--dim); font-family: var(--label); font-weight: 700; font-size: 13px; letter-spacing: .05em; flex: 0 0 auto; }
.rows .v { text-align: right; min-width: 0; overflow-wrap: anywhere; }
.rows .l { text-align: left; min-width: 0; overflow-wrap: anywhere; }
.rows .empty { color: #5a6275; font-style: italic; }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.stat { border: 1px solid var(--rim); border-radius: 5px; padding: 5px 6px; display: flex; flex-direction: column; align-items: center; gap: 0; }
.stat b { font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 700; }
.stat.prime { border-color: var(--gold-dk); background: #ffd10010; }
.stat.prime .lbl { color: var(--gold); }
.vitals { margin-top: 10px; }
.group { border-bottom: 1px solid var(--rim); padding-bottom: 16px; }
.group[hidden] { display: none; }
.group h2 { margin: 0 0 10px; font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--gold); display: flex; gap: 10px; align-items: baseline; }
.group h2 small { font-family: var(--body); font-weight: 400; font-size: 13px; color: var(--dim); }
.gcards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.gcard { background: var(--panel); border: 1px solid var(--rim); border-radius: 6px; padding: 9px 11px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.gcard.me { border-color: var(--gold-dk); }
.gtop { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
.gname { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grole { font-family: var(--label); font-weight: 700; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); border: 1px solid var(--rim); border-radius: 999px; padding: 1px 7px; flex: none; }
.r-tank .grole { color: #8fb0f0; border-color: #2f4f8f; }
.r-heal .grole { color: var(--good); border-color: #2f6f2a; }
.r-dps .grole { color: #f08a80; border-color: #8f2f28; }
.gsub { font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gbar { position: relative; height: 14px; border-radius: 2px; background: #05070c; border: 1px solid var(--rim); overflow: hidden; }
.gbar.thin { height: 10px; }
.gbar > i { display: block; height: 100%; width: 0; transition: width .15s ease-out, background-color .3s; }
.gbar > span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 700; line-height: 1; color: var(--text); text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
.gbar.thin > span { font-size: 9px; }
.gcast { font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.4em; }
.gcast .cur { color: var(--gold); }
.group.raid .gcards { display: block; }
.rgroups { display: grid; grid-template-columns: repeat(var(--ng), minmax(0, 1fr)); gap: 8px; }
.rgroup { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.rgh { font-family: var(--label); font-weight: 700; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); padding-left: 2px; }
.rcell { background: var(--panel); border: 1px solid var(--rim); border-left: 3px solid var(--rim); border-radius: 4px; padding: 3px 5px 2px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.rcell.r-tank { border-left-color: #4a7bd8; }
.rcell.r-heal { border-left-color: #3fbf3f; }
.rcell.r-dps { border-left-color: #c8312b; }
.rcell.me { border-color: var(--gold-dk); border-left-color: var(--gold); }
.rname { font-weight: 700; font-size: 13px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rcell .gbar { height: 11px; }
.rcell .gbar > span { font-size: 9px; }
.rcell .gbar.thin { height: 5px; }
.rcell .gbar.thin > span { display: none; }
.rcell .gcast { font-size: 11px; min-height: 1.3em; line-height: 1.3; }
.legend { display: inline-flex; gap: 10px; margin-left: auto; font-family: var(--body); font-size: 12px; color: var(--dim); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
.pools { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.pools .bar { height: 12px; }
.pools .bar > i { transition: width .15s ease-out, background-color .3s; }
.pools .val { color: var(--text); }
.ilvl { font-size: 12px; color: var(--dim); margin-left: 6px; font-variant-numeric: tabular-nums; }
.q0 { color: var(--poor); } .q1 { color: var(--common); } .q2 { color: var(--uncommon); } .q3 { color: var(--rare); } .q4 { color: var(--epic); } .q5 { color: var(--legend); }
.rank { font-size: 13px; color: var(--dim); white-space: nowrap; }
.money { font-variant-numeric: tabular-nums; white-space: nowrap; }
.money .g { color: #ffd34d; } .money .s { color: #c7c7cf; } .money .c { color: #d0874a; }
.tal { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.tal div { border: 1px solid var(--rim); border-radius: 5px; padding: 5px 6px; text-align: center; font-size: 13px; color: var(--dim); }
.tal div b { display: block; font-size: 18px; color: var(--text); font-variant-numeric: tabular-nums; }
.tal div.main-spec { border-color: var(--gold-dk); background: #ffd10010; }

/* chronicle */
.chron { background: var(--panel); border: 1px solid var(--rim); border-radius: 6px; padding: 14px 16px 6px; box-shadow: inset 0 0 0 1px #000; }
.log { list-style: none; margin: 0; padding: 0; max-height: 700px; overflow-y: auto; display: flex; flex-direction: column; }
.log li { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; padding: 6px 0; border-bottom: 1px solid #28314966; }
.log li:last-child { border-bottom: 0; }
.log time { font-variant-numeric: tabular-nums; font-size: 12.5px; color: #5d6578; padding-top: 2px; }
.log span { overflow-wrap: anywhere; }
.log .lvl span { color: var(--gold); font-weight: 700; }
.log .ding span { font-family: var(--display); font-size: 20px; color: var(--gold); }
.log .quest span { color: #ffe680; }
.log .spell span { color: #8fd0ff; }
.log .loot2 span { color: var(--uncommon); } .log .loot3 span { color: var(--rare); } .log .loot4 span { color: var(--epic); } .log .loot5 span { color: var(--legend); font-weight: 700; }
.log .dung span { color: #ff9a5c; font-weight: 700; }
.log .boss span { color: #ffb07a; }
.log .zone span { color: var(--good); font-weight: 700; }
.log .death span { color: #ff6b6b; }
.log .chat span { color: #f2a6ff; font-style: italic; }
.log .gold span { color: #e3cf8f; }
.log .ach span { color: #ffd34d; font-weight: 700; }
.log li.fresh { animation: fadein .5s ease-out; }
@keyframes fadein { from { background: #ffd10022; } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .log li.fresh { animation: none; } }
.tabs { display: flex; flex-wrap: wrap; gap: 4px 16px; border-bottom: 1px solid var(--rim); margin-bottom: 6px; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 2px 0 6px; font-family: var(--display); font-weight: 700; font-size: 17px; color: var(--dim); cursor: pointer; }
.tabs button small { font-family: var(--body); font-weight: 400; font-size: 12.5px; color: #5d6578; }
.tabs button[aria-selected="true"] { color: var(--gold); border-bottom-color: var(--gold); }
.tabs button:focus-visible { outline: 2px solid var(--gold-dk); outline-offset: 2px; }
.tabmeta { text-align: right; font-size: 13px; color: var(--dim); margin-bottom: 2px; min-height: 1.2em; }
.log[hidden], .journal[hidden] { display: none; }
.journal { list-style: none; margin: 0; padding: 0; max-height: 700px; overflow-y: auto; }
.journal li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid #28314966; align-items: start; }
.journal li:last-child { border-bottom: 0; }
.journal .ico { color: var(--gold); text-align: center; font-size: 15px; padding-top: 1px; }
.journal b { display: block; font-weight: 700; }
.journal span, .journal time { display: block; font-size: 14px; color: var(--dim); overflow-wrap: anywhere; }
.journal time { color: #c9b77a; font-size: 13px; font-variant-numeric: tabular-nums; }
.journal .loot { margin-top: 2px; } .journal .loot i { font-style: normal; }
.journal em { font-style: normal; font-family: var(--label); font-size: 12.5px; letter-spacing: .05em; color: var(--dim); padding-top: 2px; }
.journal li.got b { color: var(--text); }
.journal li.cur b, .journal li.cur em { color: var(--good); }
.journal li.locked { opacity: .5; } .journal li.locked .ico { color: var(--dim); }
.rows .buff { color: #8fd0ff; }
.quests .done { color: var(--good); }
.quests .cur::before { content: "▸ "; color: var(--gold); }

/* creation */
.create { max-width: 940px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 22px; padding-top: 8px; }
.create header h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(40px, 8vw, 68px); color: var(--gold); line-height: 1; text-shadow: 0 0 22px #ffd10033, 0 3px 0 #000; }
.create header p { margin: 8px 0 0; color: var(--dim); max-width: 62ch; font-size: 17px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.namebox { display: flex; gap: 8px; }
.namebox input { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--rim); border-radius: 6px; color: var(--text); font-family: var(--display); font-weight: 700; font-size: 26px; padding: 6px 12px; }
.die { background: var(--panel-2); border: 1px solid var(--rim); border-radius: 6px; padding: 0 14px; font-family: var(--label); font-weight: 700; letter-spacing: .05em; color: var(--gold); }
.factions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fbtn { text-align: left; background: var(--panel); border: 1px solid var(--rim); border-radius: 8px; padding: 12px 14px; }
.fbtn h3 { margin: 0; font-family: var(--display); font-size: 24px; }
.fbtn p { margin: 2px 0 0; color: var(--dim); font-size: 14px; }
.fbtn.Alliance[aria-pressed="true"] { border-color: var(--alli); background: linear-gradient(180deg, #4a7bd826, var(--panel) 80%); }
.fbtn.Alliance[aria-pressed="true"] h3 { color: #8fb0f0; }
.fbtn.Horde[aria-pressed="true"] { border-color: var(--horde); background: linear-gradient(180deg, #d43b3026, var(--panel) 80%); }
.fbtn.Horde[aria-pressed="true"] h3 { color: #f08a80; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: transparent; border: 1px solid var(--rim); border-radius: 999px; padding: 5px 14px; color: var(--dim); }
.chip small { font-size: 12px; color: #6a7286; margin-left: 4px; }
.chip[aria-pressed="true"] { border-color: var(--gold); color: var(--text); background: #ffd10014; }
.chip[aria-pressed="true"] small { color: var(--gold); }
.classes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.ccard { text-align: left; background: var(--panel); border: 1px solid var(--rim); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.ccard h3 { margin: 0; font-family: var(--display); font-size: 21px; line-height: 1.1; }
.ccard p { margin: 0; color: var(--dim); font-size: 14px; }
.ccard[aria-pressed="true"] { border-color: var(--gold); background: linear-gradient(180deg, #ffd1001a, var(--panel) 70%); }
.ccard:disabled { opacity: .32; }
.begin { align-self: flex-start; background: linear-gradient(180deg, #c8251b, #8a140d); color: var(--gold); border: 1px solid #e0b100; border-radius: 6px; padding: 10px 26px;
  font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: .04em; line-height: 1; box-shadow: 0 3px 0 #4a0905, 0 0 18px #c8251b44; text-shadow: 0 1px 0 #000; }
.begin:active { transform: translateY(2px); box-shadow: 0 1px 0 #4a0905; }
.note { color: #5d6578; font-size: 13px; }

/* modal */
.modal { position: fixed; inset: 0; background: #03050acc; display: grid; place-items: center; z-index: 20; padding: 16px; }
.modal .box { background: var(--panel); border: 1px solid var(--gold-dk); border-radius: 8px; padding: 20px; max-width: 380px; width: 100%; display: flex; flex-direction: column; gap: 14px; }
.modal h3 { margin: 0; font-family: var(--display); font-size: 24px; color: var(--gold); }
.modal p { margin: 0; color: var(--dim); }
.modal .acts { display: flex; gap: 10px; justify-content: flex-end; }
.danger { background: #a3241b; border: 0; color: var(--text); border-radius: 6px; padding: 6px 14px; font-family: var(--label); font-weight: 700; letter-spacing: .05em; }

@media (max-width: 1080px) {
  .main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .main .c-log { grid-column: 1 / -1; order: -1; }
  .gcards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .rgroups { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 720px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .meters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .gcards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rgroups { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .main { grid-template-columns: minmax(0, 1fr); }

// ---------- spells & level ups ----------
function trainSpells() {
  const c = cls(); let cost = 0; const learned = [], ranked = [];
  for (const sp of c.list) {
    if (sp.lvl > S.level) continue;
    const name = spellName(sp.name), rank = RANK_SPELL(sp, S.level);
    if (!(name in S.spells)) { S.spells[name] = rank; learned.push(name); cost += S.level * S.level * 4 + 10; }
    else if (S.spells[name] < rank) { S.spells[name] = rank; ranked.push(`${name} (Rank ${rank})`); cost += S.level * S.level * 4 + 10; }
    if (/^Summon (Warhorse|Felsteed)$/.test(name)) S.mount = Math.max(S.mount, 1);
    if (/^Summon (Charger|Dreadsteed)$/.test(name)) S.mount = 2;
  }
  cost = Math.min(cost, S.money); S.money -= cost;
  if (learned.length) log(`Learned ${learned.join(", ")}.`, "spell");
  if (ranked.length) log(`Trained ${ranked.join(", ")}.`, "spell");
  if (!learned.length && !ranked.length) log(`Nothing new to learn yet.`, "spell");
  else if (cost) log(`Training cost ${moneyTxt(cost)}.`, "gold");
}
function gainXp(n) {
  if (S.level >= 60) return;
  S.xp += Math.round(n);

    else log(`Level ${S.level}! ${gains.join(", ")}.`, "lvl");
    if (S.level === 10) log(`Talent points unlocked. Going ${c.trees[S.spec]}.`, "spell");
    if (S.level === 40) log(`Talent: learned ${c.ult[S.spec]} (31 points in ${c.trees[S.spec]}).`, "spell");

}

function atiesh() {

  S.parts = S.parts || {}; S.parts.splinter = (S.parts.splinter || 0) + 2 + R(4);
  if (S.parts.splinter < 40) { log(`Collected Splinters of Atiesh: ${S.parts.splinter} of 40.`, "loot4"); return; }
  (S.legendaries = S.legendaries || []).push("Atiesh, Greatstaff of the Guardian");
  gain({ name: "Atiesh, Greatstaff of the Guardian", slot: "Main Hand", ilvl: 90, q: 5 }, "LEGENDARY! Assembled");
}

function finish(t) {
  const ve = vitalEnd(t); S.hpF = ve[0]; S.mpF = ve[1]; partyFinish(t);
  switch (t.k) {
    case "arrive": {
      S.arrived = t.zone; S.loc = "hub"; S.curQ = 0;
      const before = S.quests.length; S.quests = S.quests.filter(x => x.zone === t.zone);
      if (before > S.quests.length) log(`Abandoned ${before - S.quests.length} unfinished quest${before - S.quests.length > 1 ? "s" : ""} from the last zone.`);
      const z = ZONES[t.zone]; zoneEntry(t.zone);
      log(`Entered ${t.zone} (levels ${z[0]}–${z[1]}).`, "zone");
      break;
    }
    case "field": flushTrip(); S.loc = "field"; break;
    case "hub": S.loc = "hub"; break;
    case "kill": {
      S.since = (S.since || 0) + 1;
      if (Math.random() < (t.elite ? 0.06 : 0.003)) {
        if (S.cons.hp > 0 && Math.random() < 0.7) {
          S.cons.hp--; if (!S.feats.includes("close call")) S.feats.push("close call");
          S.hpF = 0.6; log(`Close call! Nearly died to ${article(t.mob)}, but ${article(hpPot())} saved the day.`, "death");
        } else {
        S.deaths++; loseBuffs(); S.repair += S.level * S.level * 4 + 20;
        log(`Died to ${article(t.mob)}. Releasing spirit…`, "death"); S.hpF = 0;
        S.queue.unshift({ k: "ghost", d: "Running back to your corpse as a ghost", t: sec(45) }, { k: "rez", d: "Resurrecting and drinking up", t: sec(10) });
        break;
        }
      }
      S.kills++; S.repair += Math.round(S.level * 0.6);
      gainXp(mobXp(t.mobL) * (t.elite ? 6 : 1));
      const q = findQuest(t.qid);
      if (q && !questDone(q) && (q.type !== "col" ? t.mob === q.mob : Math.random() < 0.65)) {
        q.prog++;
        if (questDone(q)) log(`Objective complete: ${questText(q)}.`, "quest");
      }
      if (t.elite) { log(`${t.mob} has been slain.`, "boss"); if (!S.elites.includes(t.mob)) S.elites.push(t.mob); }
      if (S.arrived) { const ze = zoneEntry(S.arrived); ze.k++; ze.L1 = S.level; ze.t1 = realNow(); }
      const L = S.level;
      if (Math.random() < 0.55) addBag({ name: Math.random() < 0.4 ? CLOTH[clamp(Math.floor(L / 12), 0, 4)] : pick(GREYS), val: Math.round((L * L * 0.6 + 4) * (0.5 + Math.random())), q: 0 });
      const r = Math.random();
      if (r < 0.003) gain(makeItem(pick(SLOTS), t.mobL + 2, 3), `The ${t.mob} dropped`);
      else if (r < 0.025 || t.elite) gain(makeItem(pick(SLOTS), t.mobL, 2), `The ${t.mob} dropped`);
      break;
    }
    case "sell": {
      let sum = 0; S.bags = S.bags.filter(b => { if (b.name === t.name) { sum += b.val; return false; } return true; });
      S.money += sum; S.trip = (S.trip || 0) + sum; break;
    }
    case "turnin": {
      flushTrip();
      const q = findQuest(t.qid); if (!q) break;
      S.quests = S.quests.filter(x => x !== q);
      S.money += q.money; S.qdone++; S.cycleQ++;
      if (q.name === "Mankrik's Wife" && !S.feats.includes(q.name)) S.feats.push(q.name);
      if (S.zones.find(x => x.z === q.zone)) zoneEntry(q.zone).q++;
      S.done.unshift(q.name); if (S.done.length > 10) S.done.length = 10;
      log(`Quest complete: "${q.name}". ${S.level < 60 ? "+" + q.xp.toLocaleString() + " XP, " : ""}${moneyTxt(q.money)}.`, "quest");
      gainXp(q.xp);
      if (Math.random() < 0.5) { const qq = S.level < 6 ? 1 : Math.random() < 0.05 ? 3 : 2; gain(makeItem(randomSlot(), S.level + 1, qq), "Quest reward:"); }
      break;
    }
    case "accept": { flushTrip(); const q = newQuest(); log(`Accepted "${q.name}".`, "quest"); break; }
    case "travel": S.loc = "city"; log(`Arrived in ${city()}.`, "zone"); break;
    case "train": flushTrip(); trainSpells(); break;
    case "repair": { const c = Math.min(S.repair, S.money); S.money -= c; S.repair = 0; if (c) log(`Repaired everything for ${moneyTxt(c)}.`, "gold"); break; }
    case "shop": {
      const L = S.level, reserve = L >= 34 && S.mount < 1 ? 900000 : L >= 56 && S.mount < 2 ? 10000000 : 0;
      buySupplies(Math.max(0, S.money - reserve) * 0.25);
      const bag = BAGS.filter(b => b[0] <= L).pop();
      if (bag && S.money - bag[3] >= 0) {
        if (S.bagSlots.length < 4) { S.bagSlots.push(bag[2]); S.money -= bag[3]; log(`Bought ${article(bag[1])} (${bag[2]} slots).`, "gold"); }
        else { const i = S.bagSlots.indexOf(Math.min(...S.bagSlots)); if (S.bagSlots[i] < bag[2]) { S.bagSlots[i] = bag[2]; S.money -= bag[3]; log(`Swapped a small bag for ${article(bag[1])}.`, "gold"); } }
      }
      for (let n = 0; n < 2; n++) {
        let slot = SLOTS[0]; SLOTS.forEach(s => { if (power(S.equip[s]) < power(S.equip[slot])) slot = s; });
        const it = makeItem(slot, L - 1, 2), price = it.ilvl * it.ilvl * 8 + 100;
        if (power(it) > power(S.equip[slot]) && S.money - reserve >= price) { S.money -= price; gain(it, `Bought on the Auction House for ${moneyTxt(price)}:`); }
      }
      break;
    }
    case "mount": {
      if (S.level >= 60 && S.mount < 2) {
        if (S.money >= 10000000) { S.money -= 10000000; S.mount = 2; log(`Paid 1000 gold for epic riding and a ${race().epic}! The grind was worth it.`, "loot4"); }
        else log(`Epic mount fund: ${moneyTxt(S.money)} of 1000g.`, "gold");
      } else if (S.mount < 1) {
        if (S.money >= 900000) { S.money -= 900000; S.mount = 1; log(`Learned Apprentice Riding and bought a ${race().mount}! (90g)`, "loot3"); }
        else log(`Saving up for a mount: ${moneyTxt(S.money)} of 90g.`, "gold");
      }
      break;
    }
    case "choose": {
      const r = route(), old = curZone();
      while (S.leg < r.length && S.level >= r[S.leg].until) S.leg++;
      if (S.level >= 60) { S.cycleQ = 0; const pool = ENDGAME_ZONES.filter(z => z !== S.endZone); S.endZone = pick(pool); }
      S.nextCity = S.level + 2;
      if (S.level >= 10 || curZone() !== old) S.arrived = null; else S.loc = "hub";
      const d = pickDungeon(); if (d) queueDungeon(d);
      break;
    }
    case "lfg": log(`[${pick(PLAYERS)}]: ${t.chat}`, "chat");
      if (S.party && S.party.length > 4) { if (S.dg) S.dg.formed = true; const all = [{ name: S.name, role: heroRole() }, ...S.party], tanks = all.filter(m => m.role === "tank").map(m => m.name); log(`Raid assembled: ${all.length} players, ${tanks.length} tanks and ${all.filter(m => m.role === "heal").length} healers. Main tank: ${tanks[0]}.`, "chat"); }
      else if (S.party) { if (S.dg) S.dg.formed = true; log(`Group formed: ${S.party.map(m => `${m.name} (${m.cls.toLowerCase()} ${ROLE_NAME[m.role].toLowerCase()})`).join(", ")}.`, "chat"); }
      break;
    case "dtravel": S.loc = "dungeon"; log(`Entering ${t.dn}.`, "dung"); break;
    case "trash": if (!S.dg || !S.dg.raid) gainXp(mobXp(S.level + 1) * 2.4); break;
    case "boss": {
      if (Math.random() < (RAID_INFO[t.dn] ? RAID_INFO[t.dn].wipe : 0.06)) {
        S.deaths++; S.repair += S.level * S.level * 5; loseBuffs();
        log(`Wiped on ${t.boss}. Corpse run…`, "death"); S.hpF = 0; (S.party || []).forEach(m => m.hp = 0);
        const again = { ...t, el: 0 }; delete again.ve; delete again.pf;
        S.queue.unshift({ k: "ghost", d: "Running back through the instance as a ghost", t: sec(60) }, regroupTask(S.dg && S.dg.raid), again);
        break;
      }
      if (S.dg) S.dg.killed++;
      log(`${t.boss} has been defeated.`, "boss");
      gainXp(mobXp(S.level + 2) * 5);
      if (Math.random() < (S.dg && S.dg.raid ? 0.3 : 0.4)) lootDrop(t.dn, t.boss);
      if (t.dn === "Naxxramas" && Math.random() < 0.1) atiesh();
      break;
    }
    case "buff": applyBuff(t.b); break;
    case "conjure": S.cons[t.kind] = Math.max(S.cons[t.kind] || 0, 20); break;
    case "ration": {
      const n = Math.max(0, 20 - (S.cons[t.kind] || 0)), p = rationPrice(), can = Math.min(n, Math.floor(S.money / p));
      if (can > 0) { S.cons[t.kind] = (S.cons[t.kind] || 0) + can; S.money -= can * p; }
      break;
    }
    case "elixir": drinkElixir(false); break;
    case "dbuff": {
      const got = []; wantedBuffs().forEach(b => { if (!b.item || S.cons[b.item] > 0) { applyBuff(b); got.push(b.name); } });
      const ex = drinkElixir(t.raid); if (ex) got.push(ex);
      if (got.length) log(`Buffed up: ${got.join(", ")}.`, "spell");
      break;
    }
    case "dend": {
      if (RAID_INFO[t.dn]) (S.lock = S.lock || {})[t.dn] = S.time;
      const de = dungeonEntry(t.dn); de.runs++; if (!de.at) { de.at = realNow(); de.L = S.level; de.p = S.time; }
      if (!S.dungeons.includes(t.dn)) S.dungeons.push(t.dn);
      S.runs = (S.runs || 0) + 1;
      log(`${t.dn} cleared!`, "dung"); S.dg = null; S.party = null; S.loc = "city"; break;
    }
  }
  checkAch();
  dirty = true;
}

function advance(dt) {
  S.time += dt;
  let guard = 0;
  while (dt > 0 && guard++ < 400) {
    if (!S.task) { if (!S.queue.length) plan(); S.task = S.queue.shift() || { k: "rest", d: "Taking a breather", t: 3000 }; S.task.el = 0; dirty = true; }
    const rem = S.task.t - S.task.el;
    if (dt >= rem) { dt -= rem; const t = S.task; S.task = null; finish(t); }
    else { S.task.el += dt; dt = 0; }
  }
}
// progress made while the tab was closed (at 1x, capped at 12 hours)
function catchUp(ms) {
  ms = Math.min(ms, 12 * 3600 * 1000);
  if (ms < 60000) return;
  const L0 = S.level, q0 = S.qdone;
  simClock = Date.now() - ms;
  for (let left = ms; left > 0; left -= 30000) { advance(Math.min(30000, left)); simClock += Math.min(30000, left); }
  simClock = null;
  log(`While you were away (${fmtTime(ms)}): ${S.level > L0 ? `gained ${S.level - L0} level${S.level - L0 > 1 ? "s" : ""}, ` : ""}finished ${S.qdone - q0} quests.`, "lvl");
}

// tap the logo five times quickly to reveal (or hide) the speed controls
let taps = 0, tapTimer = 0;
function brandTap() {
  taps++; clearTimeout(tapTimer); tapTimer = setTimeout(() => taps = 0, 1500);
  if (taps >= 2 && taps < 5) toast(`${5 - taps} more…`);
  if (taps < 5) return;
  taps = 0; dev = !dev;
  try { localStorage.setItem(DEV_KEY, dev ? "1" : "0"); } catch (e) {}

}
let toastTimer = 0;
function toast(msg) {
  let el = document.querySelector(".toast");
  if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 1400);
}

function where() {
  if (S.loc === "dungeon" && S.dg) return S.dg.name;
  if (S.loc === "city") return S.level < 10 ? hub() : city();
  if (!S.arrived) return "On the road";
  return S.loc === "hub" ? `${hub()}, ${S.arrived}` : S.arrived;
}
function legInfo() {
  const r = route();
  if (S.leg >= r.length) return { name: `Endgame · ${curZone()}`, val: `${Math.min(S.cycleQ, 8)} / 8 quests`, p: Math.min(1, S.cycleQ / 8) };
  const start = S.leg ? r[S.leg - 1].until : 1, end = r[S.leg].until, lv = S.level + S.xp / xpNeed(S.level);
  return { name: `${r[S.leg].z} (${ZONES[r[S.leg].z][0]}–${ZONES[r[S.leg].z][1]})`, val: `until level ${end}`, p: clamp((lv - start) / Math.max(1, end - start), 0, 1) };
}

  $("qN").textContent = cq ? cq.name : "—"; $("qN").title = cq ? cq.name : "";
  if (S.dg) { $("zL").textContent = S.dg.raid ? "raid" : "dungeon"; $("zN").textContent = S.dg.name; }
  else { const li = legInfo(); $("zL").textContent = "zone"; $("zN").textContent = li.name; }
}

function renderBars() {
  const t = S.task;
  if (t) { const p = Math.min(1, t.el / t.t); $("tDesc").textContent = t.d;
    const cs = t.casts || [], ci = Math.min(cs.length - 1, Math.floor(p * cs.length));
    const from = Math.max(0, ci - 5); $("tCasts").innerHTML = (from ? "… › " : "") + cs.slice(from, ci + 1).map((s, i) => `<span${i + from === ci ? ' class="cur"' : ""}>${esc(s)}</span>`).join(" › "); $("tFill").style.width = (p * 100).toFixed(1) + "%"; $("tPct").textContent = Math.floor(p * 100) + "%"; }
  const [hf, mf] = vitalsNow(), hm = hpMax(), poolCol = f => f > 0.6 ? "var(--hp-ok)" : f > 0.35 ? "var(--hp-mid)" : f > 0.15 ? "var(--hp-low)" : "var(--hp-crit)";
  $("hpV").textContent = `${Math.round(hf * hm).toLocaleString()} / ${hm.toLocaleString()}`;
  $("hpB").style.width = (hf * 100).toFixed(1) + "%"; $("hpB").style.background = poolCol(hf);
  const res = cls().res; $("mpL").textContent = res.toLowerCase();
  if (cls().mp) { const mm = resMax(); $("mpV").textContent = `${Math.round(mf * mm).toLocaleString()} / ${mm.toLocaleString()}`; $("mpB").style.width = (mf * 100).toFixed(1) + "%"; $("mpB").style.background = poolCol(mf); }
  else { const v = secondPool(); $("mpV").textContent = `${v} / 100`; $("mpB").style.width = v + "%"; $("mpB").style.background = res === "Rage" ? "var(--rage)" : "var(--energy)"; }
  const need = xpNeed(S.level);
  if (S.level >= 60) { $("xpV").textContent = "max"; $("xpB").style.width = "100%"; }
  else { $("xpV").textContent = `${S.xp.toLocaleString()} / ${need.toLocaleString()}`; $("xpB").style.width = (S.xp / need * 100) + "%"; }
  const bc = bagCap();
  $("bgV").textContent = `${S.bags.length} / ${bc}`; $("bgB").style.width = Math.min(100, S.bags.length / bc * 100) + "%";
  const cq = S.quests.find(x => x.id === S.curQ);
  if (cq) { $("qV").textContent = `${cq.prog} / ${cq.max}`; $("qB").style.width = (cq.prog / cq.max * 100) + "%"; } else { $("qV").textContent = ""; $("qB").style.width = "0%"; }
  if (S.dg) { $("zV").textContent = `${S.dg.killed} / ${S.dg.total} bosses`; $("zB").style.width = (S.dg.killed / S.dg.total * 100) + "%"; }
  else { const li = legInfo(); $("zV").textContent = li.val; $("zB").style.width = (li.p * 100) + "%"; }
  renderGroup(hf, mf);
  if (uiTab === "log") $("elapsed").textContent = "/played " + fmtTime(S.time);
}

// party / raid frames: the hero plus the companions
let gCache = {};
function renderGroup(hf, mf) {
  const show = !!(S.party && S.dg && S.dg.formed), box = $("group");
  if (box.hidden === show) box.hidden = !show;
  if (!show) return;
  const sig = S.party.map(m => m.name).join() + S.level;
  if (box.dataset.sig !== sig) {
    box.dataset.sig = sig; gCache = {};
    const all = [{ name: S.name, race: S.race, cls: S.cls, role: heroRole(), L: S.level, me: true }, ...S.party], raid = all.length > 5;
    $("gTitle").innerHTML = raid ? `Raid <small>${esc(S.dg.name)} · ${all.length} players · ${all.filter(m => m.role === "tank").length} tanks, ${all.filter(m => m.role === "heal").length} healers</small><span class="legend"><span><i style="background:#4a7bd8"></i>tank</span><span><i style="background:#3fbf3f"></i>healer</span><span><i style="background:#c8312b"></i>dps</span></span>` : `Group <small>${esc(S.dg.name)}</small>`;
    box.classList.toggle("raid", raid);
    if (raid) {
      const groups = []; for (let g = 0; g * 5 < all.length; g++) groups.push(all.slice(g * 5, g * 5 + 5).map((m, k) => [m, g * 5 + k]));
      $("gcards").innerHTML = `<div class="rgroups" style="--ng:${groups.length}">${groups.map((g, gi) => `<div class="rgroup"><div class="rgh">Group ${gi + 1}</div>${g.map(([m, i]) => `<div class="rcell r-${m.role}${m.me ? " me" : ""}" title="${esc(m.name)}: level ${m.L} ${esc(m.race)} ${m.cls} (${ROLE_NAME[m.role]})">
        <div class="rname" style="color:${CLASSES[m.cls].color}">${esc(m.name)}</div>
        <div class="gbar"><i id="gh${i}"></i><span id="ghv${i}"></span></div>
        <div class="gbar thin"><i id="gm${i}"></i><span id="gmv${i}"></span></div>
        <div class="gcast" id="gc${i}"></div></div>`).join("")}</div>`).join("")}</div>`;
    } else
    $("gcards").innerHTML = all.map((m, i) => `<div class="gcard r-${m.role}${m.me ? " me" : ""}">
      <div class="gtop"><span class="gname" style="color:${CLASSES[m.cls].color}">${esc(m.name)}</span><span class="grole">${ROLE_NAME[m.role]}</span></div>
      <div class="gsub">Level ${m.L} ${esc(m.race)} ${m.cls}${m.me ? " · you" : ""}</div>
      <div class="gbar"><i id="gh${i}"></i><span id="ghv${i}"></span></div>
      <div class="gbar thin"><i id="gm${i}"></i><span id="gmv${i}"></span></div>
      <div class="gcast" id="gc${i}"></div></div>`).join("");
  }
  const poolCol = f => f > 0.6 ? "var(--hp-ok)" : f > 0.35 ? "var(--hp-mid)" : f > 0.15 ? "var(--hp-low)" : "var(--hp-crit)";
  const paint = (i, c, hp, mp, fight, p, cast) => {
    const C = CLASSES[c], v = C.mp ? Math.round(mp * 100) : pool2(C.res, fight, p), key = Math.round(hp * 1000) + "|" + v + "|" + cast;
    if (gCache[i] === key) return; gCache[i] = key;
    $("gh" + i).style.width = (hp * 100).toFixed(1) + "%"; $("gh" + i).style.background = poolCol(hp); $("ghv" + i).textContent = Math.round(hp * 100) + "%";
    $("gm" + i).style.width = v + "%"; $("gm" + i).style.background = C.mp ? poolCol(mp) : C.res === "Rage" ? "var(--rage)" : "var(--energy)"; $("gmv" + i).textContent = C.mp ? v + "%" : v;
    $("gc" + i).innerHTML = cast;
  };
  const raidUi = box.classList.contains("raid"), t = S.task, castHtml = (cs, ci) => ci < 0 ? "&nbsp;" : (ci > 0 && !raidUi ? `<span>${esc(cs[ci - 1])}</span> › ` : "") + `<span class="cur">${esc(cs[ci])}</span>`;
  const hc = t && t.casts && FIGHTS.includes(t.k) ? t.casts : [], hci = hc.length ? Math.min(hc.length - 1, Math.floor(Math.min(1, t.el / t.t) * hc.length)) : -1;
  paint(0, S.cls, hf, mf, hc.length > 0, t ? poolProgress(t) : 0, castHtml(hc, hci));
  S.party.forEach((m, i) => { const n = memberNow(i); paint(i + 1, m.cls, n.hp, n.mp, n.fight, n.p, castHtml(n.casts, n.ci)); });
}

let rafId = 0, lastNow = 0, saveTimer = 0;
function loop(now) {
  const dt = Math.min(now - lastNow, 1000); lastNow = now;
  if (S) {
    advance(dt * speed);
    if (dirty) { renderLists(); dirty = false; }
    renderBars();
    saveTimer += dt;
    if (saveTimer > 5000) { saveTimer = 0; save(); setTimeout(() => { const el = $("saved"); if (el) el.textContent = ""; }, 1200); }
  }
  rafId = requestAnimationFrame(loop);
}
function startGame() {
  speed = dev ? (S.speed || 1) : 1;
  gameShell(); lastLogId = 0; dirty = true;
  cancelAnimationFrame(rafId); lastNow = performance.now(); rafId = requestAnimationFrame(loop);
}
function confirmRetire() {
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">Delete ${esc(S.name)}?</h3><p>This deletes your level ${S.level} ${esc(S.cls.toLowerCase())} and all progress. A new character starts at level 1.</p><div class="acts"><button type="button" class="ghost" id="mNo">Keep playing</button><button type="button" class="danger" id="mYes">Delete character</button></div></div>`;
  document.body.appendChild(m);
  $("mNo").focus();
  $("mNo").onclick = () => m.remove();
  m.addEventListener("click", e => { if (e.target === m) m.remove(); });
  $("mYes").onclick = () => { m.remove(); wipe(); S = null; showCreate(); };
}

// ---------- rendering: character creation ----------
let draft = null;
function showCreate() {
  cancelAnimationFrame(rafId);
  draft = draft || { name: randomName(), faction: "Alliance", race: "Human", cls: "Warrior", spec: 0 };
  $("app").innerHTML = `
  <div class="create">
    <header><h1>WoWQuest</h1>
      <p>Level 1 to 60, the way it used to be, except your hero does all the work. Pick a faction, race and class, then watch them quest, loot, train and run dungeons on their own. The full journey takes about five days.</p></header>
    <div class="field"><label class="lbl" for="cName">name</label>
      <div class="namebox"><input id="cName" maxlength="24" autocomplete="off" spellcheck="false"><button type="button" class="die" id="cRandName">Random</button></div></div>
    <div class="field"><span class="lbl">faction</span><div class="factions" id="cFac"></div></div>
    <div class="field"><span class="lbl">race</span><div class="chips" id="cRace"></div></div>
    <div class="field"><span class="lbl">class</span><div class="classes" id="cCls"></div></div>
    <div class="field"><span class="lbl">talent specialization</span><div class="chips" id="cSpec"></div></div>
    <button type="button" class="begin" id="cGo">Enter World</button>
    <p class="note">A fan-made tribute. Not affiliated with or endorsed by Blizzard Entertainment.</p>
  </div>`;
  $("cName").value = draft.name;
  $("cName").addEventListener("input", e => draft.name = e.target.value);
  $("cRandName").onclick = () => { draft.name = randomName(); $("cName").value = draft.name; };
  $("cGo").onclick = () => { newHero(draft); draft = null; startGame(); };
  $("cFac").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; draft.faction = b.dataset.f; draft.race = Object.keys(RACES).find(r => RACES[r].f === draft.faction); fixClass(); drawCreate(); });
  $("cRace").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; draft.race = b.dataset.r; fixClass(); drawCreate(); });
  $("cCls").addEventListener("click", e => { const b = e.target.closest("button"); if (!b || b.disabled) return; draft.cls = b.dataset.c; draft.spec = 0; drawCreate(); });
  $("cSpec").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; draft.spec = +b.dataset.s; drawCreate(); });
  drawCreate();
}
function fixClass() { if (!ALLOWED[draft.race].includes(draft.cls)) { draft.cls = ALLOWED[draft.race][0]; draft.spec = 0; } }
function drawCreate() {
  $("cFac").innerHTML = [["Alliance", "Stormwind, Ironforge, Darnassus"], ["Horde", "Orgrimmar, Undercity, Thunder Bluff"]].map(([f, d]) => `<button type="button" class="fbtn ${f}" data-f="${f}" aria-pressed="${f === draft.faction}"><h3>${f}</h3><p>${d}</p></button>`).join("");
  $("cRace").innerHTML = Object.entries(RACES).filter(([, v]) => v.f === draft.faction).map(([r, v]) => `<button type="button" class="chip" data-r="${r}" aria-pressed="${r === draft.race}">${r}<small>${v.note}</small></button>`).join("");
  $("cCls").innerHTML = Object.entries(CLASSES).map(([n, c]) => { const ok = ALLOWED[draft.race].includes(n); return `<button type="button" class="ccard" data-c="${n}" aria-pressed="${n === draft.cls}" ${ok ? "" : "disabled"}><h3 style="color:${c.color}">${n}</h3><p>${ok ? c.blurb : `Not available to the ${draft.race}.`}</p></button>`; }).join("");
  $("cSpec").innerHTML = CLASSES[draft.cls].trees.map((t, i) => `<button type="button" class="chip" data-s="${i}" aria-pressed="${i === draft.spec}">${t}</button>`).join("");
}

// ---------- boot ----------
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
window.addEventListener("beforeunload", save);
try { const h = window.claude && window.claude.hot; if (h && typeof h.snapshot === "function") h.snapshot(() => ({ S, draft })); } catch (e) {}
// ---------- journal tabs: achievements, zones, dungeons ----------
const TABS = [["log", "Chronicle"], ["ach", "Achievements"], ["zones", "Zones"], ["dung", "Dungeons"]];
let uiTab = "log";
const fmtDate = t => new Date(t).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
const shortPlayed = ms => { const m = Math.floor(ms / 60000), d = Math.floor(m / 1440), h = Math.floor(m / 60) % 24; return d ? `${d}d ${h}h` : h ? `${h}h ${m % 60}m` : `${m % 60}m`; };
const when = (at, L, p) => at ? `${fmtDate(at)}${L ? " · level " + L : ""}${p != null ? " · " + shortPlayed(p) + " played" : ""}` : "earned before the journal existed";
function renderJournal() {
  const shown = ACH.filter(a => !a.show || a.show()), got = shown.filter(a => S.ach[a.id]);
  const r = route(), legs = [...new Set(r.map(l => l.z))], extra = S.zones.filter(e => !legs.includes(e.z));
  const doneZ = S.zones.filter(e => e.z !== S.arrived || S.leg >= r.length).length;
  const dl = factionDungeons().concat(RAIDS).sort((a, b) => a[1] - b[1]);
  $("tab-ach").textContent = ` ${got.length}/${shown.length}`;
  $("tab-zones").textContent = ` ${S.zones.length}`;
  $("tab-dung").textContent = ` ${dl.filter(d => S.dungeons.includes(d[0])).length}/${dl.length}`;
  $("log").hidden = uiTab !== "log"; $("journal").hidden = uiTab === "log";
  $("elapsed").textContent = uiTab === "log" ? "/played " + fmtTime(S.time) : uiTab === "ach" ? `${got.length} of ${shown.length} earned` : uiTab === "zones" ? `${doneZ} zones done` : `${S.dungeons.length} cleared`;
  if (uiTab === "log") return;
  let h = "";
  if (uiTab === "ach") {
    const order = got.slice().sort((a, b) => (S.ach[b.id].p ?? -1) - (S.ach[a.id].p ?? -1)).concat(shown.filter(a => !S.ach[a.id]));
    h = order.map(a => { const e = S.ach[a.id]; return `<li class="${e ? "got" : "locked"}"><span class="ico">${e ? "★" : "☆"}</span><div><b>${esc(a.name)}</b><span>${esc(a.desc)}</span>${e ? `<time>${when(e.at, e.L, e.p)}</time>` : ""}</div></li>`; }).join("");
  } else if (uiTab === "zones") {
    const row = (z, e, cur) => { const [a, b] = ZONES[z] || [0, 0];
      const st = cur ? "in progress" : e ? "done" : "ahead";
      const det = e ? (e.old ? "visited before the journal existed" : `level ${e.L0}${e.L1 > e.L0 ? "–" + e.L1 : ""} · ${e.q} quests · ${e.k.toLocaleString()} kills${e.t0 ? " · from " + fmtDate(e.t0) : ""}`) : `levels ${a}–${b}`;
      return `<li class="${st === "ahead" ? "locked" : st === "in progress" ? "cur" : "got"}"><span class="ico">${st === "done" ? "✓" : st === "in progress" ? "▸" : "·"}</span><div><b>${esc(z)}</b><span>${det}</span></div><em>${st}</em></li>`; };
    h = legs.map(z => row(z, S.zones.find(x => x.z === z), z === curZone() && S.leg < r.length)).join("")
      + extra.map(e => row(e.z, e, e.z === curZone())).join("");
  } else {
    h = dl.map(d => { const e = S.dstat[d[0]], raid = RAIDS.includes(d), done = S.dungeons.includes(d[0]) && e;
      const loot = done && e.loot.length ? `<span class="loot">${e.loot.map(x => `<i class="q${x.q}">${esc(x.n)}</i>`).join(", ")}</span>` : "";
      return `<li class="${done ? "got" : "locked"}"><span class="ico">${done ? "✓" : "·"}</span><div><b>${esc(d[0])}${raid ? ` (${RAID_INFO[d[0]].size}-man raid)` : ""}</b><span>${done ? `cleared ${e.runs}× · ${e.old ? "first clear before the journal" : "first at level " + e.L + " on " + fmtDate(e.at)}${raid && raidLocked(d[0]) ? ` · saved, resets in ${Math.ceil((RAID_INFO[d[0]].lock * 864e5 - (S.time - S.lock[d[0]])) / 864e5)}d` : ""}` : `levels ${d[1]}–${d[2]}`}</span>${loot}</div></li>`; }).join("");
  }
  $("journal").innerHTML = h;
}

function boot(data) {
  data = data || {};
  S = data.S || load();
  draft = data.draft || null;
  if (S) migrate();
  if (S && !data.S && S.savedAt) catchUp(Date.now() - S.savedAt);
  if (S) startGame(); else showCreate();
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
</body>
